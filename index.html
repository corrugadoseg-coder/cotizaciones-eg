<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EG Corrugados · Seguimiento de Cotizaciones</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3f7d4e">
<style>
  :root{
    --craft:#b07a43;--craft-dark:#8a5c2e;--ink:#2b2320;--paper:#f5efe4;
    --card:#fffaf2;--line:#e3d6c2;--green:#3f7d4e;--red:#b4472f;
    --amber:#c98a1e;--slate:#6b7280;--blue:#2f5b96;--purple:#5a3f96;
    --shadow:0 1px 3px rgba(80,55,30,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px}
  header{background:var(--craft);color:#fff;padding:14px 20px;
    display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  header .logo{width:40px;height:40px;border-radius:8px;background:#fff;
    object-fit:contain;padding:3px;box-shadow:var(--shadow)}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px}
  header .sub{font-size:12px;opacity:.85;margin-top:1px}
  .wrap{max-width:1350px;margin:0 auto;padding:18px 20px 60px}

  /* Panel pendientes */
  .pendientes{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .pcard{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:14px 16px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
  .pcard:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(80,55,30,.15)}
  .pcard.activo{border-color:var(--craft);background:#fdf3e3}
  .pcard .num{font-size:28px;font-weight:700;line-height:1}
  .pcard .lbl{font-size:12px;color:var(--slate);margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
  .pcard.cotizar .num{color:var(--blue)}
  .pcard.recontactar .num{color:var(--amber)}
  .pcard.espera .num{color:var(--purple)}
  .pcard.total .num{color:var(--craft-dark)}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .search{flex:1;min-width:240px;position:relative}
  .search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--line);
    border-radius:8px;font-size:14px;background:var(--card);color:var(--ink)}
  .search svg{position:absolute;left:12px;top:11px;opacity:.5}
  select,.btn{padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink);font-size:13px;cursor:pointer}
  .btn-primary{background:var(--craft);color:#fff;border-color:var(--craft);font-weight:600}
  .btn-primary:hover{background:var(--craft-dark)}
  .count{font-size:12px;color:var(--slate);margin-bottom:8px}

  table{width:100%;border-collapse:collapse;background:var(--card);
    border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
  thead th{background:#efe3ce;text-align:left;padding:11px 9px;font-size:11px;
    text-transform:uppercase;letter-spacing:.5px;color:#7a5a30;border-bottom:2px solid var(--craft)}
  tbody td{padding:9px 9px;border-bottom:1px solid #f0e7d6;vertical-align:top}
  tbody tr:hover{background:#fdf6ea}
  tbody tr.reconOn{background:#fdf1dd}
  tbody tr.reconOn:hover{background:#fbead0}
  .det{max-width:260px;font-size:13px;line-height:1.35;cursor:pointer;color:var(--ink)}
  .det:hover{color:var(--craft-dark);text-decoration:underline dotted}
  .cli{font-weight:600;cursor:pointer}
  .cli:hover{color:var(--craft-dark);text-decoration:underline dotted}
  .muted{color:var(--slate);font-size:12px}
  .monto{font-variant-numeric:tabular-nums;white-space:nowrap}

  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .b-venta{background:#e4f0e6;color:var(--green)}
  .b-noventa{background:#f6e2dc;color:var(--red)}
  .b-espera{background:#e9e3f7;color:var(--purple)}
  .b-pend{background:#eee;color:#666}
  .b-sinresp{background:#f0ece4;color:#8a7a60}
  .b-cotizar{background:#e3ecf7;color:var(--blue)}
  .b-cotizado{background:#e9f0e3;color:#5a7a30}
  .b-recontactar{background:#f9ecd4;color:var(--amber)}

  .sel{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:#fff;cursor:pointer;max-width:170px}
  .loading,.empty{text-align:center;padding:44px;color:var(--slate)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
  .toast.show{opacity:1}

  .modal{display:none;position:fixed;inset:0;background:rgba(43,35,32,.5);z-index:40;
    align-items:flex-start;justify-content:center;overflow:auto;padding:26px 16px}
  .modal .box{background:var(--card);border-radius:12px;max-width:640px;width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.25);padding:22px}
  .modal h2{margin:0;font-size:17px;color:var(--craft-dark)}
  label.f{font-size:12px;display:block;margin-top:10px}
  label.f input,label.f textarea,label.f select{width:100%;padding:8px;border:1px solid var(--line);
    border-radius:6px;margin-top:3px;font-family:inherit;font-size:13px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  footer{text-align:center;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--slate);font-size:12px}

  /* Saludo */
  .saludo{margin-bottom:16px}
  .saludo .hola{font-size:18px;font-weight:600;color:var(--craft-dark)}
  .saludo .fecha{font-size:13px;color:var(--slate);text-transform:capitalize}
  .saludo .resumen{font-size:13px;color:var(--ink);margin-top:4px}
  .saludo .cambiar{font-size:11px;color:var(--slate);margin-top:4px}
  .saludo .cambiar a{color:var(--craft);text-decoration:none}
  .saludo .cambiar a:hover{text-decoration:underline}
  .saludo .quien{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .saludo .btnQuien{font-weight:600}
  .saludo .btnQuien:hover{background:var(--craft);color:#fff;border-color:var(--craft)}

  /* Titileo de tarjetas con pendientes */
  @keyframes pulso{0%,100%{box-shadow:0 1px 3px rgba(80,55,30,.12)}50%{box-shadow:0 0 0 3px rgba(201,138,30,.35)}}
  .pcard.titila{animation:pulso 1.1s ease-in-out 6}

  /* Días de antigüedad y alertas */
  .dias{font-size:11px;color:var(--slate);display:block;margin-top:2px}
  .dias.alerta{color:var(--amber);font-weight:600}
  .dias.urgente{color:var(--red);font-weight:700}
  tbody tr.viejo3{background:#fdf1dd}
  tbody tr.viejo3:hover{background:#fbead0}
  tbody tr.viejo7{background:#f9e6d8}
  tbody tr.viejo7:hover{background:#f5ddc9}

  /* Encabezados ordenables */
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:var(--craft-dark)}
  thead th .flecha{font-size:9px;opacity:.6;margin-left:3px}

  /* Resumen del mes */
  .resmes{display:flex;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .resmes .item{font-size:13px}
  .resmes .item b{font-size:18px;color:var(--craft-dark);display:block}
  @media(max-width:820px){
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tbody tr{margin-bottom:12px;border:1px solid var(--line);border-radius:10px;padding:6px}
    tbody td{border:none;padding:5px 8px}
    td::before{content:attr(data-l);font-size:10px;text-transform:uppercase;color:var(--slate);display:block;letter-spacing:.5px}
    .det{max-width:none}
  }
</style>
</head>

  <div><h1>Seguimiento de Cotizaciones</h1><div class="sub">EG Corrugados · panel interno</div></div>

<div class="wrap">
  <!-- Saludo -->
  <div class="saludo" id="saludo"></div>

  <!-- Resumen del mes -->
  <div class="resmes" id="resmes" style="display:none"></div>

  <!-- Pendientes de hoy -->
  <div class="pendientes" id="pendientes"></div>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="q" placeholder="Buscar por cliente, denominación o detalle...">
    </div>
    <select id="fAccion"><option value="">Toda acción</option></select>
    <select id="fResultado"><option value="">Todo resultado</option></select>
    <select id="fCanal"><option value="">Todos los canales</option></select>
    <button class="btn btn-primary" id="btnNueva">✉ Nueva consulta</button>
    <button class="btn" id="btnStats">📊 Estadísticas</button>
    <button class="btn" id="btnReload">↻ Actualizar</button>
  </div>

</div>

<!-- MODAL NUEVA / EDITAR -->
<div class="modal" id="modalEdit">
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h2 id="editTitulo">Nueva consulta</h2>
      <button class="btn" id="editClose" style="padding:4px 10px">✕</button>
    </div>
    <div class="row2">
      <label class="f">Cliente / Denominación<input id="eDenom"></label>
      <label class="f">Contacto<input id="eContacto"></label>
    </div>
    <div class="row2">
      <label class="f">Email<input id="eEmail"></label>
      <label class="f">Teléfono<input id="eTel"></label>
    </div>
    <label class="f">Detalle cotizado<textarea id="eDetalle" rows="3"></textarea></label>
    <div class="row2">
      <label class="f">Canal
        <select id="eCanal">
          <option>MAIL</option><option>WHATSAPP</option><option>TELÉFONO</option>
          <option>INSTAGRAM</option><option>PÁGINA WEB</option>
          <option>ESPONTÁNEA/MOSTRADOR</option><option>VISITA A CLIENTE</option>
        </select></label>
      <label class="f">Monto cotizado<input id="eMonto" inputmode="numeric"></label>
    </div>
    <div style="margin-top:12px;padding:10px 12px;background:#fdf6ea;border:1px solid var(--line);border-radius:8px">
      <label style="font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="eEsCampania" style="width:auto;margin:0;cursor:pointer">
        <span><b>¿Esta consulta viene de una campaña?</b></span>
      </label>
      <label class="f" id="wrapCampania" style="display:none;margin-top:8px">¿Cuál?
        <select id="eCampania">
          <option value="">— elegir campaña —</option>
          <option>AMAFRA LEADS</option>
        </select>
      </label>
    </div>
    <div class="row2">
      <label class="f">Fecha de ingreso<input id="eFIngreso" type="date"></label>
      <label class="f">Fecha de cotización<input id="eFCot" type="date"></label>
    </div>
    <div class="row2">
      <label class="f">Acción
        <select id="eAccion"><option>A COTIZAR</option><option>COTIZADO</option><option>RECONTACTAR</option></select></label>
      <label class="f">Resultado
        <select id="eResultado">
          <option>PENDIENTE</option><option>A LA ESPERA DE RESPUESTA</option>
          <option>RECONTACTAR</option><option>SIN RESPUESTA</option>
          <option>VENTA</option><option>NO VENTA</option>
        </select></label>
    </div>
    <div class="row2">
      <label class="f">Fecha recontacto<input id="eFReco" type="date"></label>
      <label class="f">Fecha cierre<input id="eFCierre" type="date"></label>
    </div>
    <label class="f" id="wrapMotivo" style="display:none">Motivo de NO VENTA
      <select id="eMotivoSel">
        <option value="">— elegir —</option>
        <option>Precio</option><option>Plazo de entrega</option>
        <option>Eligió otro proveedor</option><option>No respondió</option>
        <option value="__otro">Otro (escribir)</option>
      </select>
      <input id="eMotivoTxt" placeholder="Escribí el motivo" style="display:none;margin-top:6px">
    </label>
    <label class="f">Observaciones <span class="muted" style="font-weight:400">(bitácora: charlas, cambios, novedades)</span>
      <textarea id="eObs" rows="3" placeholder="Ej: 18/7 llamé, quedó en confirmar el lunes"></textarea></label>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" id="editCancel">Cancelar</button>
      <button class="btn btn-primary" id="editGuardar">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL ESTADÍSTICAS -->
<div class="modal" id="modalStats">
  <div class="box" style="max-width:820px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <h2>Estadísticas</h2><button class="btn" id="sClose" style="padding:4px 10px">✕</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin:10px 0 18px">

    </div>
    <div id="sBody"></div>
  </div>
</div>

let DATOS=[], editFila=null;

const ACCIONES=["A COTIZAR","COTIZADO","RECONTACTAR"];
const RESULTADOS=["PENDIENTE","A LA ESPERA DE RESPUESTA","RECONTACTAR","SIN RESPUESTA","VENTA","NO VENTA"];

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function fechaLimpia(v){if(!v)return '';v=String(v);return v.indexOf('T')>0?v.slice(0,10):v;}
function esNueva(d){const v=String(d["Es nueva"]||"").toUpperCase().trim();return v==="SÍ"||v==="SI";}

function badgeAccion(v){v=(v||"").toUpperCase();
  if(v==="A COTIZAR")return"b-cotizar";if(v==="COTIZADO")return"b-cotizado";
  if(v==="RECONTACTAR")return"b-recontactar";return"b-pend";}
function badgeResult(v){v=(v||"").toUpperCase();
  if(v==="VENTA")return"b-venta";if(v==="NO VENTA")return"b-noventa";
  if(v==="A LA ESPERA DE RESPUESTA")return"b-espera";if(v==="PENDIENTE")return"b-pend";
  if(v==="SIN RESPUESTA")return"b-sinresp";if(v==="RECONTACTAR")return"b-recontactar";return"b-pend";}

function diasDesde(fechaStr){
  const f=fechaLimpia(fechaStr);if(!f)return null;
  const d=new Date(f+"T00:00:00");if(isNaN(d))return null;
  const hoy=new Date();hoy.setHours(0,0,0,0);
  return Math.floor((hoy-d)/(24*3600*1000));
}
function textoDias(n){
  if(n===null)return"";
  if(n===0)return"hoy";
  if(n===1)return"hace 1 día";
  return"hace "+n+" días";
}

const EQUIPO=["Raquel","Emilio","Alejandro","Eduardo"];

function getUsuario(){
  try{return localStorage.getItem('eg_usuario')||"";}catch(e){return "";}
}
function setUsuario(n){
  try{localStorage.setItem('eg_usuario',n);}catch(e){}
  renderSaludo();
}
function pedirUsuario(){
  const cont=document.getElementById('saludo');
  cont.innerHTML=`<div class="hola">¡Hola! ¿Quién sos?</div>
    <div class="fecha">Elegí tu nombre para personalizar tu panel</div>
    <div class="quien">${EQUIPO.map(n=>`<button class="btn btnQuien" data-n="${n}">${n}</button>`).join('')}</div>`;
  cont.querySelectorAll('.btnQuien').forEach(b=>b.addEventListener('click',()=>setUsuario(b.dataset.n)));
}

function renderSaludo(){
  const usuario=getUsuario();
  if(!usuario){pedirUsuario();return;}
  const h=new Date().getHours();
  let saludo="Buenas";
  if(h<12)saludo="Buenos días";else if(h<20)saludo="Buenas tardes";else saludo="Buenas noches";
  const fecha=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  const nuevas=DATOS.filter(esNueva);
  const nCot=nuevas.filter(d=>(d["Acción"]||"").toUpperCase()==="A COTIZAR").length;
  const nRec=nuevas.filter(d=>(d["Acción"]||"").toUpperCase()==="RECONTACTAR").length;
  let msg;
  const pend=nCot+nRec;
  if(pend===0)msg="No tenés tareas pendientes por ahora. 👍";
  else{
    const partes=[];
    if(nCot)partes.push(`<b>${nCot}</b> para cotizar`);
    if(nRec)partes.push(`<b>${nRec}</b> para recontactar`);
    msg="Tenés "+partes.join(" y ")+".";
  }
  document.getElementById('saludo').innerHTML=
    `<div class="hola">${saludo}, ${usuario}</div>
     <div class="fecha">${fecha}</div>
     <div class="resumen">${msg}</div>
     <div class="cambiar">¿No sos ${usuario}? <a href="#" id="cambiarUsuario">Cambiar</a></div>`;
  const link=document.getElementById('cambiarUsuario');
  if(link)link.addEventListener('click',ev=>{ev.preventDefault();pedirUsuario();});
}

function renderResumenMes(){
  const ahora=new Date();
  const mesAct=ahora.getFullYear()+"-"+String(ahora.getMonth()+1).padStart(2,'0');
  const delMes=DATOS.filter(d=>String(fechaLimpia(d["Fecha de pedido"])).startsWith(mesAct));
  if(!delMes.length){document.getElementById('resmes').style.display='none';return;}
  const consultas=delMes.length;
  const ventas=delMes.filter(d=>(d.Resultado||"").toUpperCase()==="VENTA").length;
  const noventa=delMes.filter(d=>(d.Resultado||"").toUpperCase()==="NO VENTA").length;
  let monto=0;delMes.forEach(d=>{if((d.Resultado||"").toUpperCase()==="VENTA"){const m=Number(d["Monto cotizado"]);if(!isNaN(m))monto+=m;}});
  const nombreMes=ahora.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  document.getElementById('resmes').style.display='flex';
  document.getElementById('resmes').innerHTML=
    `<div class="item" style="text-transform:capitalize;align-self:center;color:var(--slate)">📅 ${nombreMes}</div>
     <div class="item"><b>${consultas}</b> consultas</div>
     <div class="item"><b>${ventas}</b> ventas</div>
     <div class="item"><b>${noventa}</b> no venta</div>
     <div class="item"><b>$ ${monto.toLocaleString('es-AR')}</b> vendido</div>`;
}

async function cargar(){
  document.getElementById('cont').innerHTML='<div class="loading">Cargando cotizaciones…</div>';
  try{
    const r=await fetch(API+"?accion=listar");
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||"error");
    DATOS=j.datos.reverse();
    llenarFiltros();renderSaludo();renderResumenMes();renderPendientes();render();
  }catch(e){
    document.getElementById('cont').innerHTML='<div class="empty">No se pudo cargar.<br><span class="muted">'+e+'</span></div>';
  }
}

function llenarFiltros(){
  const canales=[...new Set(DATOS.map(d=>d.Canal).filter(Boolean))].sort();
  document.getElementById('fCanal').innerHTML='<option value="">Todos los canales</option>'+canales.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('fAccion').innerHTML='<option value="">Toda acción</option>'+ACCIONES.map(a=>`<option>${a}</option>`).join('');
  document.getElementById('fResultado').innerHTML='<option value="">Todo resultado</option>'+RESULTADOS.map(r=>`<option>${r}</option>`).join('');
}

let filtroPend="";
let ordenCol="ingreso", ordenAsc=false;
function renderPendientes(){
  // Solo cuentan las cotizaciones nuevas (en seguimiento activo)
  const nuevas=DATOS.filter(esNueva);
  const nCot=nuevas.filter(d=>(d["Acción"]||"").toUpperCase()==="A COTIZAR").length;
  const nRec=nuevas.filter(d=>(d["Acción"]||"").toUpperCase()==="RECONTACTAR").length;
  const nEsp=nuevas.filter(d=>(d.Resultado||"").toUpperCase()==="A LA ESPERA DE RESPUESTA").length;
  const cont=document.getElementById('pendientes');
  cont.innerHTML=`
    <div class="pcard cotizar ${filtroPend==='A COTIZAR'?'activo':''} ${nCot>0?'titila':''}" data-f="A COTIZAR"><div class="num">${nCot}</div><div class="lbl">Para cotizar</div></div>
    <div class="pcard recontactar ${filtroPend==='RECONTACTAR'?'activo':''} ${nRec>0?'titila':''}" data-f="RECONTACTAR"><div class="num">${nRec}</div><div class="lbl">Para recontactar</div></div>
    <div class="pcard espera ${filtroPend==='ESPERA'?'activo':''}" data-f="ESPERA"><div class="num">${nEsp}</div><div class="lbl">Esperando respuesta</div></div>
    <div class="pcard total ${filtroPend===''?'activo':''}" data-f=""><div class="num">${nuevas.length}</div><div class="lbl">En seguimiento</div></div>`;
  cont.querySelectorAll('.pcard').forEach(c=>c.addEventListener('click',()=>{
    filtroPend=c.dataset.f;renderPendientes();render();
  }));
}

function limpiarTel(t){
  // Deja solo dígitos. Para Argentina, arma formato internacional básico.
  let n=String(t||'').replace(/[^\d]/g,'');
  if(!n)return '';
  // Si no empieza con 54 (Argentina), se lo agrega
  if(n.length>=10 && n.indexOf('54')!==0) n='54'+n;
  return n;
}
function msgRecontacto(d){
  const nombre=(d.Contacto||'').trim();
  const hola=nombre?`Hola ${nombre}, ¿cómo estás?`:'Hola, ¿cómo estás?';
  return `${hola} Te escribo de EG Corrugados para saber si pudiste ver la cotización que te enviamos. Quedamos a tu disposición por cualquier consulta. ¡Saludos!`;
}
function botonesRecontacto(d){
  const tel=limpiarTel(d["Teléfono"]);
  const email=(d.Email||'').trim();
  const recon=esNueva(d)&&(d["Acción"]||'').toUpperCase()==='RECONTACTAR';
  const cls=recon?'btn btn-primary':'btn';
  let botones='';
  if(tel){
    const msg=encodeURIComponent(msgRecontacto(d));
    botones+=`<a class="${cls}" style="padding:4px 8px;text-decoration:none" href="https://wa.me/${tel}?text=${msg}" target="_blank" title="Recontactar por WhatsApp">💬</a> `;
  }
  if(email){
    const asunto=encodeURIComponent('Cotización EG Corrugados'+(d.Denominación?' - '+d.Denominación:''));
    const cuerpo=encodeURIComponent(msgRecontacto(d));
    botones+=`<a class="${cls}" style="padding:4px 8px;text-decoration:none" href="mailto:${email}?subject=${asunto}&body=${cuerpo}" title="Recontactar por mail">✉</a> `;
  }
  return botones;
}

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const fa=document.getElementById('fAccion').value.toUpperCase();
  const fr=document.getElementById('fResultado').value.toUpperCase();
  const fc=document.getElementById('fCanal').value;

  let filas=DATOS.filter(d=>{
    if(filtroPend==='A COTIZAR' && !(esNueva(d)&&(d["Acción"]||"").toUpperCase()==='A COTIZAR'))return false;
    if(filtroPend==='RECONTACTAR' && !(esNueva(d)&&(d["Acción"]||"").toUpperCase()==='RECONTACTAR'))return false;
    if(filtroPend==='ESPERA' && !(esNueva(d)&&(d.Resultado||"").toUpperCase()==='A LA ESPERA DE RESPUESTA'))return false;
    if(fa && (d["Acción"]||"").toUpperCase()!==fa)return false;
    if(fr && (d.Resultado||"").toUpperCase()!==fr)return false;
    if(fc && (d.Canal||"")!==fc)return false;
    if(q){const b=((d.Denominación||"")+" "+(d.Contacto||"")+" "+String(d["Detalle cotizado"]||"")).toLowerCase();if(!b.includes(q))return false;}
    return true;
  });

  document.getElementById('count').textContent=`${filas.length} cotización(es)`+(q?` · "${q}"`:"")+(filtroPend?` · ${filtroPend==='ESPERA'?'esperando respuesta':filtroPend.toLowerCase()}`:"");

  if(!filas.length){document.getElementById('cont').innerHTML='<div class="empty">Sin resultados.</div>';return;}

  // Ordenamiento
  const getVal={
    ingreso:d=>fechaLimpia(d["Fecha de pedido"])||"",
    cliente:d=>(d.Denominación||"").toLowerCase(),
    monto:d=>Number(d["Monto cotizado"])||0,
    canal:d=>(d.Canal||"").toLowerCase()
  };
  if(getVal[ordenCol]){
    filas.sort((a,b)=>{
      const va=getVal[ordenCol](a),vb=getVal[ordenCol](b);
      if(va<vb)return ordenAsc?-1:1;
      if(va>vb)return ordenAsc?1:-1;
      return 0;
    });
  }
  const fl=c=>ordenCol===c?(ordenAsc?'▲':'▼'):'';

  let h=`<table><thead><tr>
    <th class="sortable" data-sort="ingreso">F. ingreso<span class="flecha">${fl('ingreso')}</span></th>
    <th class="sortable" data-sort="cliente">Cliente<span class="flecha">${fl('cliente')}</span></th>
    <th>Detalle</th>
    <th class="sortable" data-sort="monto">Monto<span class="flecha">${fl('monto')}</span></th>
    <th class="sortable" data-sort="canal">Canal<span class="flecha">${fl('canal')}</span></th>
    <th>Acción</th><th>Resultado</th><th>Recontactar</th><th></th></tr></thead><tbody>`;
  for(const d of filas){
    const nueva=esNueva(d);
    const acc=(d["Acción"]||"").toUpperCase();
    const res=(d.Resultado||"").toUpperCase();
    const recon=nueva&&acc==="RECONTACTAR";
    const monto=d["Monto cotizado"]&&!isNaN(Number(d["Monto cotizado"]))?("$ "+Number(d["Monto cotizado"]).toLocaleString('es-AR')):'<span class="muted">—</span>';
    // Selects solo para cotizaciones nuevas; histórico se muestra fijo
    const accCell=nueva
      ? `<select class="sel selAccion" data-fila="${d._fila}">${ACCIONES.map(a=>`<option ${a===acc?'selected':''}>${a}</option>`).join('')}</select>`
      : `<span class="muted">—</span>`;
    const resCell=nueva
      ? `<select class="sel selResult" data-fila="${d._fila}">${RESULTADOS.map(r=>`<option ${r===res?'selected':''}>${r}</option>`).join('')}</select>`
      : `<span class="badge ${badgeResult(res)}">${res||'—'}</span>`;

    // Antigüedad: solo alertar en cotizaciones nuevas sin cerrar
    const abierta=nueva && res!=="VENTA" && res!=="NO VENTA" && res!=="SIN RESPUESTA";
    const dias=diasDesde(d["Fecha de pedido"]);
    let claseFila=recon?'reconOn':'';
    let claseDias='dias';
    if(abierta && dias!==null){
      if(dias>=7){claseFila='viejo7';claseDias='dias urgente';}
      else if(dias>=3){claseFila='viejo3';claseDias='dias alerta';}
    }
    const diasTxt=abierta?`<span class="${claseDias}">${textoDias(dias)}</span>`:'';

    h+=`<tr class="${claseFila}">
      <td data-l="Ingreso">${fechaLimpia(d["Fecha de pedido"])||'<span class="muted">—</span>'}${diasTxt}</td>
      <td data-l="Cliente"><span class="cli" data-edit="${d._fila}">${d.Denominación||''}</span>${d.Contacto?'<div class="muted">'+d.Contacto+'</div>':''}</td>
      <td data-l="Detalle" class="det" data-edit="${d._fila}">${String(d["Detalle cotizado"]||'').slice(0,90)}${String(d["Detalle cotizado"]||'').length>90?'…':''}</td>
      <td data-l="Monto" class="monto">${monto}</td>
      <td data-l="Canal"><span class="muted">${d.Canal||''}</span></td>
      <td data-l="Acción">${recon?'⚠ ':''}${accCell}</td>
      <td data-l="Resultado">${resCell}</td>
      <td data-l="Recontactar">${botonesRecontacto(d)||'<span class="muted">—</span>'}</td>
      <td data-l=""><button class="btn editBtn" data-edit="${d._fila}" style="padding:4px 8px" title="${String(d["Observaciones"]||'').trim()?'Tiene observaciones:\n'+String(d["Observaciones"]).replace(/"/g,'&quot;'):'Editar'}">✎${String(d["Observaciones"]||'').trim()?' <span style=&quot;color:var(--craft)&quot;>📝</span>':''}</button></td>
    </tr>`;
  }
  h+='</tbody></table>';
  document.getElementById('cont').innerHTML=h;

  document.querySelectorAll('th.sortable').forEach(th=>th.addEventListener('click',()=>{
    const col=th.dataset.sort;
    if(ordenCol===col)ordenAsc=!ordenAsc;
    else{ordenCol=col;ordenAsc=true;}
    render();
  }));

  document.querySelectorAll('.selAccion').forEach(s=>s.addEventListener('change',e=>{
    const fila=e.target.dataset.fila, acc=e.target.value;
    const d=DATOS.find(x=>String(x._fila)===String(fila));
    const resActual=(d&&d.Resultado||"").toUpperCase();
    const datos={"Acción":acc};
    // Acomodar el Resultado en los pasos obvios (sin pisar cierres ni SIN RESPUESTA)
    if(resActual!=="VENTA"&&resActual!=="NO VENTA"&&resActual!=="SIN RESPUESTA"){
      if(acc==="COTIZADO"||acc==="RECONTACTAR"){
        if(resActual==="PENDIENTE"||resActual===""||resActual==="RECONTACTAR")datos["Resultado"]="A LA ESPERA DE RESPUESTA";
      }else if(acc==="A COTIZAR"){
        datos["Resultado"]="PENDIENTE";
      }
    }
    // Si pasa a RECONTACTAR, registrar fecha de recontacto si no hay
    if(acc==="RECONTACTAR" && d && !fechaLimpia(d["Fecha recontacto"])){
      datos["Fecha recontacto"]=new Date().toISOString().slice(0,10);
    }
    guardarCampo(fila,datos);
  }));
  document.querySelectorAll('.selResult').forEach(s=>s.addEventListener('change',e=>{
    const val=e.target.value;
    if(val==="NO VENTA"||val==="VENTA"){openEdit(e.target.dataset.fila);}
    else guardarCampo(e.target.dataset.fila,{"Resultado":val});
  }));
  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',e=>{
    const f=e.currentTarget.dataset.edit;if(f)openEdit(f);
  }));
}

async function guardarCampo(fila,datos){
  try{
    await fetch(API,{method:'POST',body:JSON.stringify({accion:'actualizar',fila:Number(fila),datos:datos})});
    const o=DATOS.find(x=>String(x._fila)===String(fila));if(o)Object.assign(o,datos);
    toast("Guardado");renderPendientes();render();
  }catch(e){toast("No se pudo guardar");}
}

const modalEdit=document.getElementById('modalEdit');
function openNueva(){
  editFila=null;
  document.getElementById('editTitulo').textContent="Nueva consulta";
  ['eDenom','eContacto','eEmail','eTel','eDetalle','eMonto','eFReco','eFCierre','eMotivoTxt','eObs'].forEach(id=>document.getElementById(id).value="");

  document.getElementById('eCampania').value="";

  document.getElementById('eAccion').value="A COTIZAR";
  document.getElementById('eResultado').value="PENDIENTE";

  document.getElementById('eFIngreso').value=hoy;
  document.getElementById('eFCot').value="";
  document.getElementById('eMotivoSel').value="";
  toggleMotivo();

}
function openEdit(fila){
  const d=DATOS.find(x=>String(x._fila)===String(fila));if(!d)return;
  editFila=fila;
  document.getElementById('editTitulo').textContent="Editar cotización";
  document.getElementById('eDenom').value=d.Denominación||"";
  document.getElementById('eContacto').value=d.Contacto||"";
  document.getElementById('eEmail').value=d.Email||"";
  document.getElementById('eTel').value=d["Teléfono"]||"";
  document.getElementById('eDetalle').value=d["Detalle cotizado"]||"";
  document.getElementById('eMonto').value=d["Monto cotizado"]||"";
  document.getElementById('eObs').value=d["Observaciones"]||"";
  document.getElementById('eCanal').value=d.Canal||"MAIL";
  const camp=(d["Campaña"]||"").trim();
  document.getElementById('eEsCampania').checked=!!camp;
  document.getElementById('eCampania').value=camp;
  toggleCampania();
  document.getElementById('eAccion').value=(d["Acción"]||"A COTIZAR").toUpperCase();
  document.getElementById('eResultado').value=(d.Resultado||"PENDIENTE").toUpperCase();
  document.getElementById('eFIngreso').value=fechaLimpia(d["Fecha de pedido"]);
  document.getElementById('eFCot').value=fechaLimpia(d["Fecha de cotización"]);
  document.getElementById('eFReco').value=fechaLimpia(d["Fecha recontacto"]);
  document.getElementById('eFCierre').value=fechaLimpia(d["Fecha cierre"]);
  const mot=d["Motivo no venta"]||"";
  const fijos=["Precio","Plazo de entrega","Eligió otro proveedor","No respondió"];
  if(mot&&fijos.includes(mot)){document.getElementById('eMotivoSel').value=mot;document.getElementById('eMotivoTxt').value="";}
  else if(mot){document.getElementById('eMotivoSel').value="__otro";document.getElementById('eMotivoTxt').value=mot;}
  else{document.getElementById('eMotivoSel').value="";document.getElementById('eMotivoTxt').value="";}
  toggleMotivo();
  modalEdit.style.display='flex';
}
function toggleCampania(){
  const marcado=document.getElementById('eEsCampania').checked;
  document.getElementById('wrapCampania').style.display=marcado?'block':'none';
  if(!marcado)document.getElementById('eCampania').value="";
}
document.getElementById('eEsCampania').addEventListener('change',toggleCampania);

function toggleMotivo(){
  const esNV=document.getElementById('eResultado').value==="NO VENTA";
  document.getElementById('wrapMotivo').style.display=esNV?'block':'none';
  const otro=document.getElementById('eMotivoSel').value==="__otro";
  document.getElementById('eMotivoTxt').style.display=otro?'block':'none';
}
document.getElementById('eResultado').addEventListener('change',toggleMotivo);
document.getElementById('eMotivoSel').addEventListener('change',toggleMotivo);
document.getElementById('btnNueva').addEventListener('click',openNueva);
document.getElementById('editClose').addEventListener('click',()=>modalEdit.style.display='none');
document.getElementById('editCancel').addEventListener('click',()=>modalEdit.style.display='none');

document.getElementById('editGuardar').addEventListener('click',async()=>{
  let motivo="";
  const ms=document.getElementById('eMotivoSel').value;
  if(ms==="__otro")motivo=document.getElementById('eMotivoTxt').value.trim();
  else if(ms)motivo=ms;
  const fila={
    "Fecha de pedido":document.getElementById('eFIngreso').value,
    "Fecha de cotización":document.getElementById('eFCot').value,
    "Denominación":document.getElementById('eDenom').value.trim(),
    "Contacto":document.getElementById('eContacto').value.trim(),
    "Detalle cotizado":document.getElementById('eDetalle').value.trim(),
    "Monto cotizado":document.getElementById('eMonto').value.trim(),
    "Canal":document.getElementById('eCanal').value,
    "Campaña":document.getElementById('eEsCampania').checked?document.getElementById('eCampania').value:"",
    "Resultado":document.getElementById('eResultado').value,
    "Email":document.getElementById('eEmail').value.trim(),
    "Teléfono":document.getElementById('eTel').value.trim(),
    "Acción":document.getElementById('eAccion').value,
    "Fecha recontacto":document.getElementById('eFReco').value,
    "Fecha cierre":document.getElementById('eFCierre').value,
    "Motivo no venta":motivo,
    "Observaciones":document.getElementById('eObs').value.trim(),
    "Es nueva":"SÍ"
  };
  const btn=document.getElementById('editGuardar');btn.disabled=true;btn.textContent="Guardando…";
  try{
    if(editFila){
      await fetch(API,{method:'POST',body:JSON.stringify({accion:'actualizar',fila:Number(editFila),datos:fila})});
      const o=DATOS.find(x=>String(x._fila)===String(editFila));if(o)Object.assign(o,fila);
    }else{
      await fetch(API,{method:'POST',body:JSON.stringify({accion:'agregar',fila:fila})});
      await cargar();
    }
    toast("Guardado");modalEdit.style.display='none';renderPendientes();render();
  }catch(e){toast("No se pudo guardar");}
  btn.disabled=false;btn.textContent="Guardar";
});

/* ---------- ESTADÍSTICAS ---------- */
const modalStats=document.getElementById('modalStats');
document.getElementById('btnStats').addEventListener('click',abrirStats);
document.getElementById('sClose').addEventListener('click',()=>modalStats.style.display='none');
document.getElementById('sPeriodo').addEventListener('change',renderStats);
function anioDe(d){const m=String(d["Fecha de pedido"]||"").match(/(\d{4})/);return m?m[1]:"";}
function abrirStats(){
  const anios=[...new Set(DATOS.map(anioDe).filter(Boolean))].sort().reverse();
  document.getElementById('sPeriodo').innerHTML='<option value="">Todos los años</option>'+anios.map(a=>`<option>${a}</option>`).join('');
  modalStats.style.display='flex';renderStats();
}
function renderStats(){
  const per=document.getElementById('sPeriodo').value;
  let filas=DATOS.filter(d=>!per||anioDe(d)===per);
  const total=filas.length;
  const res={};filas.forEach(d=>{const r=(d.Resultado||"PENDIENTE").toUpperCase();res[r]=(res[r]||0)+1;});
  const ventas=res["VENTA"]||0;
  const cerradas=(res["VENTA"]||0)+(res["NO VENTA"]||0);
  const conv=cerradas>0?Math.round(ventas/cerradas*100):0;
  let montoV=0;filas.forEach(d=>{if((d.Resultado||"").toUpperCase()==="VENTA"){const m=Number(d["Monto cotizado"]);if(!isNaN(m))montoV+=m;}});
  const canL={},canV={};
  filas.forEach(d=>{const c=d.Canal||"SIN DATO";canL[c]=(canL[c]||0)+1;if((d.Resultado||"").toUpperCase()==="VENTA")canV[c]=(canV[c]||0)+1;});
  // Campañas: consultas y ventas por campaña, más el comparativo campaña vs espontáneo
  const campL={},campV={};
  let conCamp=0,conCampV=0,sinCamp=0,sinCampV=0;
  filas.forEach(d=>{
    const c=(d["Campaña"]||"").trim();
    const esVenta=(d.Resultado||"").toUpperCase()==="VENTA";
    if(c){
      campL[c]=(campL[c]||0)+1; if(esVenta)campV[c]=(campV[c]||0)+1;
      conCamp++; if(esVenta)conCampV++;
    }else{ sinCamp++; if(esVenta)sinCampV++; }
  });
  const fmt=n=>"$ "+Number(n).toLocaleString('es-AR');
  const card=(v,l,col)=>`<div style="flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px"><div style="font-size:24px;font-weight:700;color:${col||'var(--ink)'}">${v}</div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-top:2px">${l}</div></div>`;
  const barra=(o,o2)=>{const ks=Object.keys(o).sort((a,b)=>o[b]-o[a]);const mx=Math.max(...ks.map(k=>o[k]),1);
    return ks.map(k=>{const n=o[k],v=(o2&&o2[k])||0,pct=Math.round(n/mx*100),cv=n>0?Math.round(v/n*100):0;
      return `<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${k}</span><span class="muted">${n} consulta(s)${o2?` · ${v} venta(s) · ${cv}%`:''}</span></div><div style="background:#efe3ce;border-radius:6px;height:10px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--craft)"></div></div></div>`;}).join('');};
  const resList=Object.keys(res).sort((a,b)=>res[b]-res[a]).map(k=>{const pct=total>0?Math.round(res[k]/total*100):0;
    return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0e7d6;font-size:13px"><span><span class="badge ${badgeResult(k)}">${k}</span></span><span><b>${res[k]}</b> <span class="muted">(${pct}%)</span></span></div>`;}).join('');
  document.getElementById('sBody').innerHTML=`
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
      ${card(total,'Cotizaciones')}${card(ventas,'Ventas','var(--green)')}
      ${card(conv+'%','Conversión','var(--craft-dark)')}${card(res["NO VENTA"]||0,'No venta','var(--red)')}</div>
    <div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:20px">
      <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.4px">Monto total vendido</div>
      <div style="font-size:26px;font-weight:700;color:var(--green);margin-top:2px">${fmt(montoV)}</div></div>
    <h3 style="font-size:14px;color:var(--craft-dark);margin:0 0 10px">Canales (llegada y conversión)</h3>
    <div style="margin-bottom:22px">${barra(canL,canV)}</div>
    ${conCamp>0?`
    <h3 style="font-size:14px;color:var(--craft-dark);margin:0 0 10px">Campañas</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <div style="flex:1;min-width:150px;background:#fdf6ea;border:1px solid var(--craft);border-radius:10px;padding:12px">
        <div style="font-size:20px;font-weight:700;color:var(--craft-dark)">${conCamp} <span style="font-size:13px;font-weight:400">consultas</span></div>
        <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.4px">Desde campañas</div>
        <div style="font-size:12px;margin-top:4px">${conCampV} venta(s) · <b>${conCamp>0?Math.round(conCampV/conCamp*100):0}%</b> conversión</div>
      </div>
      <div style="flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px">
        <div style="font-size:20px;font-weight:700;color:var(--slate)">${sinCamp} <span style="font-size:13px;font-weight:400">consultas</span></div>
        <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.4px">Sin campaña</div>
        <div style="font-size:12px;margin-top:4px">${sinCampV} venta(s) · <b>${sinCamp>0?Math.round(sinCampV/sinCamp*100):0}%</b> conversión</div>
      </div>
    </div>
    <div style="margin-bottom:22px">${barra(campL,campV)}</div>`:''}
    <h3 style="font-size:14px;color:var(--craft-dark);margin:0 0 6px">Tipo de respuesta</h3><div>${resList}</div>`;
}

document.getElementById('q').addEventListener('input',render);
document.getElementById('fAccion').addEventListener('change',render);
document.getElementById('fResultado').addEventListener('change',render);
document.getElementById('fCanal').addEventListener('change',render);
document.getElementById('btnReload').addEventListener('click',cargar);
cargar();
</script>
</body>
</html>
